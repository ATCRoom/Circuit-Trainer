# Builds TWR Trainer on GitHub's Windows machines at every push.
# The simulation engine and the maps library with their self-tests, TWR Trainer (the instructor's window, step 4a) and
# ATCRoom Map Creator. Both programs are attached to each run as one artifact (Actions tab -> latest run -> Artifacts; a
# GitHub account is needed to download it). They do not require .NET to be installed. No release yet.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      # Checks the simulation engine (turns, climbs, speeds, clock, callsigns, placement on the Earth): the build
      # fails if a check fails.
      - name: Self-test of the simulation engine
        run: dotnet run --project Sim/SelfTest/ATCRoom.Sim.SelfTest.csproj -c Release

      # The circuits flown by the self-test, drawn (open the html file in a browser): also when a check failed.
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: circuits-of-the-self-test
          path: circuits.html
          if-no-files-found: warn

      # Checks the map format and the importers: the build fails if a check fails.
      - name: Self-test of the map format and importers
        run: dotnet run --project MapCreator/SelfTest/ATCRoom.Maps.SelfTest.csproj -c Release

      # ATCRoom Map Creator: makes the map files (open ATCRoom map format) from the user's own files.
      - name: Build ATCRoom Map Creator
        run: >
          dotnet publish MapCreator/App/ATCRoomMapCreator.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish-mapcreator

      # TWR Trainer: the program (one exe), with the Map Creator beside it.
      - name: Build TWR Trainer
        run: >
          dotnet publish Trainer/TWRTrainer.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish-trainer

      - name: Put the Map Creator beside TWR Trainer
        run: Copy-Item publish-mapcreator/ATCRoomMapCreator.exe publish-trainer/

      - uses: actions/upload-artifact@v5
        with:
          name: TWRTrainer-win-x64
          path: |
            publish-trainer/TWRTrainer.exe
            publish-trainer/ATCRoomMapCreator.exe
